[package]
name = "agent_harness"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
contracts = { path = "../contracts" }
dbs = { path = "../dbs" }
inference = { path = "../inference" }
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
regex = "1.12.4"

[features]
verbose-logging = ["contracts/verbose-logging", "inference/verbose-logging"]

[dev-dependencies]
tempfile = "3.27.0"
