[package]
name = "desktop_server"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { path = "../parser" }
inference = { path = "../inference" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
contracts = { path = "../contracts" }
llama-cpp-sys-2 = { version = "0.1.3", optional = true }

[features]
verbose-logging = ["parser/verbose-logging", "inference/verbose-logging"]
llama_native = ["dep:llama-cpp-sys-2"]