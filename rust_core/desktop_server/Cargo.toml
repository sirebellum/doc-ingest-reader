[package]
name = "desktop_server"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { path = "../parser" }
inference = { path = "../inference" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
contracts = { path = "../contracts" }
[features]
verbose-logging = ["parser/verbose-logging", "inference/verbose-logging"]
