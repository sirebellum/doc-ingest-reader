[package]
name = "inference"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
contracts = { path = "../contracts" }
llama-cpp-sys-2 = { version = "0.1.3", optional = true }
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"

[features]
llama_native = ["dep:llama-cpp-sys-2"]
verbose-logging = ["contracts/verbose-logging"]

[dev-dependencies]
serial_test = "3.1.1"
httpmock = "0.7"
