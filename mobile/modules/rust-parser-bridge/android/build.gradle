apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'mobile.rustparserbridge'
version = '1.0.0'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        
        externalNativeBuild {
            cmake {
                cppFlags "-O3 -frtti -fexceptions -std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs += [project.file('../../../../rust_core/libs/aarch64-linux-android')]
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
    implementation "com.facebook.react:react-native:+" // Inherits from standard project
}
